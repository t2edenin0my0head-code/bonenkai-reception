<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カメラテスト</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>
</head>

<body>

  <h2>📷 カメラテスト</h2>

  <div id="reader" style="width:100%;"></div>

  <p id="message">カメラを起動しています...</p>

  <script>

    const message =
      document.getElementById("message");

    const scanner =
      new Html5Qrcode("reader");

    scanner.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      function(decodedText) {

        message.textContent =
          "QR読み取り成功：" + decodedText;

      },
      function(errorMessage) {

        // QRが見つからない間は何もしない

      }
    )
    .then(function() {

      message.textContent =
        "カメラ起動成功！QRコードをかざしてください。";

    })
    .catch(function(error) {

      message.textContent =
        "カメラ起動失敗：" + error;

      console.error(error);

    });

  </script>

</body>
</html>
